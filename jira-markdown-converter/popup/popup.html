<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>PowerEdit for Jira</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <h1>PowerEdit for Jira</h1>
    <a class="head__link" href="#" id="options">Einstellungen</a>
  </header>

  <main class="body">
    <div class="notice" id="grantNotice" hidden>
      <p class="notice__text">
        Auf <b id="grantHost"></b> ist die Erweiterung noch nicht freigegeben.
        Das ist bei Jira Server und Data Center einmalig noetig.
      </p>
      <button type="button" class="btn btn--primary" id="grant">Diese Jira-Adresse freigeben</button>
    </div>

    <div class="toggle-card" id="toggleCard">
      <label class="switch">
        <input type="checkbox" id="convertOnPaste">
        <span class="switch__track"><span class="switch__knob"></span></span>
        <span class="switch__text">
          <b id="toggleLabel">Automatik ist an</b>
          <small id="toggleHint">Eingefuegtes Markdown wird umgewandelt.</small>
        </span>
      </label>
    </div>

    <label class="label" for="input">Markdown aus Azure DevOps</label>
    <textarea id="input" class="area" rows="8" spellcheck="false"
              placeholder="Markdown hier einfuegen (Strg+V) ..."></textarea>

    <div class="row">
      <button type="button" class="btn" id="from-clipboard">Aus Zwischenablage</button>
      <button type="button" class="btn" id="clear">Leeren</button>
    </div>

    <label class="label" for="output">Jira-Markup</label>
    <textarea id="output" class="area area--output" rows="8" spellcheck="false" readonly></textarea>

    <div class="row row--main">
      <button type="button" class="btn btn--primary" id="insert">In Jira einfuegen</button>
      <button type="button" class="btn" id="copy">Kopieren</button>
    </div>

    <p class="status" id="status" role="status"></p>
  </main>

  <script src="../src/settings.js"></script>
  <script src="../src/converter.js"></script>
  <script src="popup.js"></script>
</body>
</html>
