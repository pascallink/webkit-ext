name: Build Extension

on:
  push:
    branches: [main]
    paths:
      - 'jira-markdown-converter/**'
      - '.github/workflows/build-extension.yml'
  pull_request:
    paths:
      - 'jira-markdown-converter/**'
      - '.github/workflows/build-extension.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jira-markdown-converter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Package extension
        run: |
          rm -rf dist
          mkdir -p dist/jira-markdown-converter
          cp -r manifest.json src popup options icons dist/jira-markdown-converter/
          (cd dist && zip -r ../jira-markdown-converter.zip jira-markdown-converter)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jira-markdown-converter
          path: jira-markdown-converter/jira-markdown-converter.zip

      - name: Publish rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: false
          make_latest: 'true'
          body: Automatisch gebautes ZIP des aktuellen `main`-Stands. Nicht signiert, ueber "Entpackte Erweiterung laden" zu installieren.
          files: jira-markdown-converter/jira-markdown-converter.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
