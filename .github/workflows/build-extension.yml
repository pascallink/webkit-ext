name: Build Extensions

# Prueft jede Erweiterung im Repo (jeder oberste Ordner mit manifest.json):
# Install -> Lint -> Test. Neue Erweiterungen brauchen hier keine Aenderung.
#
# Es entstehen bewusst KEINE ZIPs mehr. Die baut release.yml, und nur dann,
# wenn ein Tag auf eine neue Minor-Version (x.y.0) gepusht wird.

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            */package-lock.json

      # Cache-Schluessel aus den Playwright-Versionen aller Projekte, nicht aus
      # dem Lockfile-Hash: sonst wuerfe jeder eslint-Bump die rund 160 MB
      # Chromium mit weg. Kein Projekt mit Playwright -> "none", der Cache-Step
      # entfaellt.
      - name: Playwright-Versionen ermitteln
        id: playwright
        run: |
          set -eo pipefail
          versions=$(for file in */package.json; do
            [ -f "$file" ] || continue
            jq -r '.devDependencies.playwright // empty' "$file"
          done | sort -u | paste -sd- -)
          echo "key=${versions:-none}" >> "$GITHUB_OUTPUT"

      - name: Chromium aus dem Cache
        if: steps.playwright.outputs.key != 'none'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.key }}

      - name: Root-Skripte testen
        run: npm test

      - name: Lint und Test je Erweiterung
        run: |
          set -eo pipefail
          found=0
          for dir in */ ; do
            dir=${dir%/}
            [ -f "$dir/manifest.json" ] || continue
            jq -e 'has("manifest_version")' "$dir/manifest.json" >/dev/null 2>&1 || continue
            found=1
            echo "::group::$dir"

            if [ -f "$dir/package.json" ]; then
              if [ -f "$dir/package-lock.json" ]; then
                npm ci --prefix "$dir"
              else
                npm install --prefix "$dir"
              fi
              # Bei Cache-Treffer erkennt Playwright den Browser und laedt
              # nichts nach; --with-deps bleibt fuer die apt-Bibliotheken.
              if jq -e '.devDependencies.playwright' "$dir/package.json" >/dev/null 2>&1; then
                npx --prefix "$dir" playwright install --with-deps chromium
              fi
              npm run lint --prefix "$dir" --if-present
              npm test --prefix "$dir" --if-present
            fi

            echo "::endgroup::"
          done
          [ "$found" = 1 ] || echo "Keine Erweiterung mit manifest.json gefunden."
