name: Build Extensions

# Prueft jede Erweiterung im Repo (jeder oberste Ordner mit manifest.json):
# Install -> Lint -> Test. Neue Erweiterungen brauchen hier keine Aenderung.
#
# Es entstehen bewusst KEINE ZIPs mehr. Die baut release.yml, und nur dann,
# wenn ein Release auf eine neue Minor-Version (x.y.0) veroeffentlicht wird.

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Lint und Test je Erweiterung
        run: |
          set -eo pipefail
          found=0
          for dir in */ ; do
            dir=${dir%/}
            [ -f "$dir/manifest.json" ] || continue
            jq -e 'has("manifest_version")' "$dir/manifest.json" >/dev/null 2>&1 || continue
            found=1
            echo "::group::$dir"

            if [ -f "$dir/package.json" ]; then
              if [ -f "$dir/package-lock.json" ]; then
                npm ci --prefix "$dir"
              else
                npm install --prefix "$dir"
              fi
              if jq -e '.devDependencies.playwright' "$dir/package.json" >/dev/null 2>&1; then
                npx --prefix "$dir" playwright install --with-deps chromium
              fi
              npm run lint --prefix "$dir" --if-present
              npm test --prefix "$dir" --if-present
            fi

            echo "::endgroup::"
          done
          [ "$found" = 1 ] || echo "Keine Erweiterung mit manifest.json gefunden."
