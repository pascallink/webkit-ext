name: Release ZIPs

# ZIPs entstehen ausschliesslich hier: beim Push eines Tags auf eine neue
# Minor-Version (x.y.0). Patch-Tags und beliebige andere Tags laufen bewusst
# ins Leere.
#
# Regel: je Erweiterung entsteht <ordner>-<version>.zip.
# Ausnahme: wer in seiner package.json "stableZipAlias": true setzt, bekommt
# denselben Inhalt zusaetzlich als <ordner>.zip. Nur damit funktioniert
# /releases/latest/download/<ordner>.zip als dauerhafter Direktlink.
#
# Trigger bewusst ein Tag-Push, nicht das release-Event: GitHub loest fuer
# Draft-Releases die Aktivitaetstypen created/edited/deleted nicht aus, ein
# release-Trigger liefe also nie fuer einen Entwurf. Und ein bereits
# veroeffentlichtes Release ist sofort immutable, danach lassen sich keine
# Assets mehr anhaengen. Deshalb legt dieser Workflow das Release selbst an -
# mit allen ZIPs in einem Zug -, sobald der Tag gepusht wird. Die
# Immutability greift damit nie in ein leeres Release.
#
# Ueber workflow_dispatch laeuft derselbe Weg zur Probe: dry_run ist mit true
# vorbelegt, dann wird nur gebaut und aufgelistet, ohne ein Release anzufassen.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.0'
      - 'v[0-9]+.[0-9]+.0'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag, der gebaut werden soll'
        required: true
      dry_run:
        description: 'Nur bauen und auflisten, kein Release anfassen'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      # Eine einzige Stelle, an der der Tag herkommt: beim Push aus der Ref,
      # beim Probelauf aus der Eingabe. Alle Folgeschritte lesen nur noch das.
      - name: Tag ermitteln
        id: meta
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Bewusst ein harter Fehler statt eines stillen Uebersprungs: ein Tag
      # in falscher Form soll auffallen und nicht klaglos durchlaufen. Der
      # Tag-Filter oben deckt den Push ab, dieses Gate den Probelauf.
      - name: Tag pruefen
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.0$ ]]; then
            echo "::error::Tag '$TAG' ist keine Minor-Version (x.y.0). Ohne diese Form entsteht kein Release und keine ZIPs."
            exit 1
          fi

      # Ein publiziertes Release ist immutable und nimmt keine Assets mehr an.
      # Lieber hier mit Anleitung abbrechen als spaeter im Upload mit der
      # kryptischen Meldung aus Issue #71. Kein Release (none) und ein Entwurf
      # (true) laufen weiter.
      - name: Kein publiziertes Release ueberschreiben
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq .isDraft 2>/dev/null || echo "none")
          if [ "$state" = "false" ]; then
            echo "::error::Release '$TAG' ist bereits publiziert und damit immutable - Assets lassen sich nicht mehr anhaengen. Release loeschen und den Tag neu setzen, oder die naechste Minor-Version waehlen."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Erweiterungen bauen und packen
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -eo pipefail
          mkdir -p release
          matched=0
          for dir in */ ; do
            dir=${dir%/}
            [ -f "$dir/manifest.json" ] || continue
            jq -e 'has("manifest_version")' "$dir/manifest.json" >/dev/null 2>&1 || continue
            echo "::group::$dir"

            version=$(jq -r .version "$dir/manifest.json")

            # manifest.json und package.json duerfen nie auseinanderlaufen -
            # das waere immer ein Fehler, nicht bloss eine Unschoenheit.
            if [ -f "$dir/package.json" ]; then
              pkg_version=$(jq -r .version "$dir/package.json")
              if [ "$version" != "$pkg_version" ]; then
                echo "::error::$dir: manifest.json meldet $version, package.json meldet $pkg_version."
                exit 1
              fi
            fi

            # Abweichung vom Release-Tag ist je Projekt nur eine Warnung: bei
            # mehreren Erweiterungen im Repo kann ein Tag nicht fuer alle
            # passen. Gezaehlt wird trotzdem - siehe Gate hinter der Schleife.
            if [ "$version" != "${TAG#v}" ]; then
              echo "::warning::$dir steht auf $version, das Release heisst ${TAG#v}."
            else
              matched=$((matched + 1))
            fi

            if [ -f "$dir/package.json" ]; then
              if [ -f "$dir/package-lock.json" ]; then
                npm ci --prefix "$dir"
              else
                npm install --prefix "$dir"
              fi
              if jq -e '.devDependencies.playwright' "$dir/package.json" >/dev/null 2>&1; then
                npx --prefix "$dir" playwright install --with-deps chromium
              fi
              npm run lint --prefix "$dir" --if-present
              npm test --prefix "$dir" --if-present
            fi

            stage="stage/$dir"
            rm -rf "$stage"
            mkdir -p "$stage"
            cp -r "$dir/." "$stage/"
            # Nur Laufzeitdateien ins ZIP: was hier stehen bleibt, geht so an
            # den Store. Doku und Entwicklungsdateien fliegen raus.
            rm -rf "$stage/node_modules" "$stage/test" "$stage/docs" \
              "$stage/package.json" "$stage/package-lock.json" \
              "$stage/eslint.config.mjs" "$stage/CLAUDE.md" \
              "$stage/README.md" "$stage/CHANGELOG.md"
            rm -f "$stage"/.eslintrc*

            (cd stage && zip -rq "$GITHUB_WORKSPACE/release/$dir-$version.zip" "$dir")

            # Ausnahme: Erweiterungen mit "stableZipAlias": true in ihrer
            # package.json bekommen denselben Inhalt zusaetzlich unter festem
            # Namen. Nur das macht /releases/latest/download/<ordner>.zip
            # moeglich - noetig, solange Links dieser Form im Umlauf sind.
            if jq -e '.stableZipAlias == true' "$dir/package.json" >/dev/null 2>&1; then
              cp "release/$dir-$version.zip" "release/$dir.zip"
              echo "$dir: Alias $dir.zip mitgebaut."
            fi

            echo "::endgroup::"
          done
          ls -la release

          # Passt keine einzige Erweiterung zum Tag, zeigt der Tag auf den
          # falschen Commit. Genau so entstand unter Tag 1.3.0 ein ZIP mit
          # Version 1.2.23 (Issue #71) - deshalb hier hart abbrechen.
          if [ "$matched" -eq 0 ]; then
            echo "::error::Keine Erweiterung steht auf Version ${TAG#v}. Der Tag zeigt auf den falschen Commit - die ZIPs truegen eine fremde Versionsnummer. Tag auf den Commit mit der passenden Version umsetzen."
            exit 1
          fi

      - name: Release mit ZIPs anlegen
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: release/*.zip
          draft: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Zusammenfassung
        if: always()
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Release $TAG"
            if [ "$DRY_RUN" = "true" ]; then
              echo "Probelauf - es wurde kein Release angefasst."
            else
              echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
            fi
            echo
            echo '```'
            ls -la release 2>/dev/null || echo "keine ZIPs gebaut"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
