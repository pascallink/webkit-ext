name: Release ZIPs

# ZIPs entstehen ausschliesslich hier: wenn ein Release auf eine neue
# Minor-Version (x.y.0) angelegt wird. Patch-Releases und beliebige Tags
# laufen bewusst ins Leere.
#
# Regel: je Erweiterung entsteht <ordner>-<version>.zip.
# Ausnahme: wer in seiner package.json "stableZipAlias": true setzt, bekommt
# denselben Inhalt zusaetzlich als <ordner>.zip. Nur damit funktioniert
# /releases/latest/download/<ordner>.zip als dauerhafter Direktlink.
#
# Trigger bewusst "created" statt "published": GitHub macht jedes
# veroeffentlichte Release sofort immutable, danach lassen sich keine Assets
# mehr anhaengen. Deshalb legt Pascal das Release als Entwurf (Draft) an -
# das loest "created" mit draft=true aus. Dieser Workflow haengt die ZIPs an
# den Entwurf und veroeffentlicht ihn erst danach selbst.

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      # Wer direkt veroeffentlicht statt einen Entwurf zu speichern, laesst
      # dem Workflow kein Zeitfenster fuer den Asset-Upload - das Release ist
      # zu diesem Zeitpunkt schon immutable. Lieber laut abbrechen als still
      # ohne Assets zu bleiben.
      - name: Entwurf-Status pruefen
        env:
          IS_DRAFT: ${{ github.event.release.draft }}
        run: |
          if [ "$IS_DRAFT" != "true" ]; then
            echo "::error::Release wurde direkt veroeffentlicht statt als Entwurf gespeichert. Immutable Releases erlauben danach keinen Asset-Upload mehr. Loesung: Release loeschen, Tag behalten, erneut anlegen und dabei 'Save draft' statt 'Publish release' waehlen - dieser Workflow haengt die ZIPs an und veroeffentlicht das Release danach selbst."
            exit 1
          fi

      # Bewusst ein harter Fehler statt eines stillen Uebersprungs: ein Release
      # ohne Assets wird zum neuesten Release, und damit laeuft der Link
      # /releases/latest/download/<ordner>.zip ins Leere. Das soll auffallen,
      # solange es sich noch reparieren laesst.
      - name: Tag pruefen
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.0$ ]]; then
            echo "::error::Release '$TAG' ist keine Minor-Version (x.y.0). Es entstehen keine ZIPs, und dieses Release wird zum neuesten ohne Assets - der Download-Link laeuft danach ins Leere. Release loeschen oder als Prerelease markieren."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Erweiterungen bauen und packen
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eo pipefail
          mkdir -p release
          for dir in */ ; do
            dir=${dir%/}
            [ -f "$dir/manifest.json" ] || continue
            jq -e 'has("manifest_version")' "$dir/manifest.json" >/dev/null 2>&1 || continue
            echo "::group::$dir"

            version=$(jq -r .version "$dir/manifest.json")

            # manifest.json und package.json duerfen nie auseinanderlaufen -
            # das waere immer ein Fehler, nicht bloss eine Unschoenheit.
            if [ -f "$dir/package.json" ]; then
              pkg_version=$(jq -r .version "$dir/package.json")
              if [ "$version" != "$pkg_version" ]; then
                echo "::error::$dir: manifest.json meldet $version, package.json meldet $pkg_version."
                exit 1
              fi
            fi

            # Abweichung vom Release-Tag ist nur eine Warnung: bei mehreren
            # Erweiterungen im Repo kann ein Tag nicht fuer alle passen.
            if [ "$version" != "${TAG#v}" ]; then
              echo "::warning::$dir steht auf $version, das Release heisst ${TAG#v}."
            fi

            if [ -f "$dir/package.json" ]; then
              if [ -f "$dir/package-lock.json" ]; then
                npm ci --prefix "$dir"
              else
                npm install --prefix "$dir"
              fi
              if jq -e '.devDependencies.playwright' "$dir/package.json" >/dev/null 2>&1; then
                npx --prefix "$dir" playwright install --with-deps chromium
              fi
              npm run lint --prefix "$dir" --if-present
              npm test --prefix "$dir" --if-present
            fi

            stage="stage/$dir"
            rm -rf "$stage"
            mkdir -p "$stage"
            cp -r "$dir/." "$stage/"
            # Nur Laufzeitdateien ins ZIP: was hier stehen bleibt, geht so an
            # den Store. Doku und Entwicklungsdateien fliegen raus.
            rm -rf "$stage/node_modules" "$stage/test" "$stage/docs" \
              "$stage/package.json" "$stage/package-lock.json" \
              "$stage/eslint.config.mjs" "$stage/CLAUDE.md" \
              "$stage/README.md" "$stage/CHANGELOG.md"
            rm -f "$stage"/.eslintrc*

            (cd stage && zip -rq "$GITHUB_WORKSPACE/release/$dir-$version.zip" "$dir")

            # Ausnahme: Erweiterungen mit "stableZipAlias": true in ihrer
            # package.json bekommen denselben Inhalt zusaetzlich unter festem
            # Namen. Nur das macht /releases/latest/download/<ordner>.zip
            # moeglich - noetig, solange Links dieser Form im Umlauf sind.
            if jq -e '.stableZipAlias == true' "$dir/package.json" >/dev/null 2>&1; then
              cp "release/$dir-$version.zip" "release/$dir.zip"
              echo "$dir: Alias $dir.zip mitgebaut."
            fi

            echo "::endgroup::"
          done
          ls -la release

      - name: ZIPs an das Release haengen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release/*.zip
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Getrennt vom Upload: erst wenn alle Assets sicher am Entwurf haengen,
      # macht dieser Schritt das Release oeffentlich. Ab hier ist es
      # immutable - Assets lassen sich nicht mehr nachtraeglich aendern.
      - name: Release veroeffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
